name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libflac-dev libvorbis-dev libogg-dev libmpg123-dev shellcheck
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: make fmt-check vet staticcheck security
      - run: go test -count=1 -race ./...
      - run: make coverage
      - run: shellcheck install.sh
      - run: git diff --exit-code

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
          - os: windows-2025
            goos: windows
            goarch: amd64
            msystem: MINGW64
            cgo_cc: gcc
            cc_package: mingw-w64-x86_64-gcc
            pkg_config_package: mingw-w64-x86_64-pkg-config
            codec_prefix: mingw-w64-x86_64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            msystem: CLANGARM64
            cgo_cc: clang
            cc_package: mingw-w64-clang-aarch64-clang
            pkg_config_package: mingw-w64-clang-aarch64-pkgconf
            codec_prefix: mingw-w64-clang-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install codec libs (macOS)
        if: matrix.goos == 'darwin'
        run: brew install flac libvorbis libogg mpg123 pkg-config
      - name: Set up MinGW toolchain (Windows)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          # windows-11-arm has no preinstalled C:\msys64.
          release: true
          install: >-
            ${{ matrix.cc_package }}
            ${{ matrix.pkg_config_package }}
            ${{ matrix.codec_prefix }}-libogg
            ${{ matrix.codec_prefix }}-libvorbis
            ${{ matrix.codec_prefix }}-flac
            ${{ matrix.codec_prefix }}-mpg123
      - name: Test and build (Windows)
        if: matrix.goos == 'windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          # CLANGARM64's compiler is clang. Go cgo looks for gcc unless CC is set.
          CC: ${{ matrix.cgo_cc }}
          # Some MSYS2 libogg builds ship a libogg-0.dll whose export table is
          # missing ogg_stream_iovecin, even though it's present in the static
          # libogg.a. Force just that library to link statically.
          CGO_LDFLAGS: "-Wl,-Bstatic -logg -Wl,-Bdynamic"
        run: |
          go test -count=1 ./...
          go build -trimpath ./...
      - name: Test and build (non-Windows)
        if: matrix.goos != 'windows'
        run: |
          go test -count=1 ./...
          go build -trimpath ./...
